<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seglingsledning</title>
  <script>
    const target = new URL("regattaapp_37.html", window.location.href);
    const incoming = new URLSearchParams(window.location.search || "");
    incoming.forEach((value, key) => target.searchParams.set(key, value));
    target.searchParams.set("admin", "1");
    target.hash = window.location.hash || "#ledning";
    window.location.replace(target.toString());
  </script>
</head>
<body>
  <p>Öppnar seglingsledningen...</p>
  <p><a href="./regattaapp_37.html?admin=1#ledning">Klicka här om sidan inte öppnas automatiskt.</a></p>
</body>
</html>
